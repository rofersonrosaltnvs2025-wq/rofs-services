<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROFS Services — Customer Login</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script></head><body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-4"><main class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-7 shadow-2xl"><div class="flex items-center gap-3 mb-7"><div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-2xl font-extrabold">R</div><div><h1 class="font-extrabold text-xl">ROFS SERVICES</h1><p class="text-sm text-indigo-300">Customer Portal</p></div></div><div class="flex gap-2 mb-6"><button id="loginTab" class="flex-1 rounded-lg py-2 bg-indigo-600 font-semibold">Login</button><button id="signupTab" class="flex-1 rounded-lg py-2 bg-gray-800 text-gray-300 font-semibold">Create account</button></div><form id="authForm" class="space-y-4"><label class="block text-sm">Email address<input id="email" type="email" required autocomplete="email" class="mt-1 w-full rounded-xl bg-gray-950 border border-gray-700 p-3 outline-none focus:border-indigo-500"></label><label class="block text-sm">Password<input id="password" type="password" required minlength="8" autocomplete="current-password" class="mt-1 w-full rounded-xl bg-gray-950 border border-gray-700 p-3 outline-none focus:border-indigo-500"></label><button id="submitBtn" class="w-full rounded-xl bg-indigo-600 hover:bg-indigo-500 py-3 font-bold">Login</button></form><p id="message" class="text-sm mt-4 text-gray-300" role="status"></p><p class="text-xs text-gray-500 mt-6">For administrator access, use the separate <a class="text-indigo-300 underline" href="./admin-login.html">Admin Login page</a>.</p></main><script>
let mode='login'; const client=window.supabase.createClient(window.ROFS_SUPABASE_URL,window.ROFS_SUPABASE_ANON_KEY); const form=document.getElementById('authForm'), msg=document.getElementById('message'), btn=document.getElementById('submitBtn');
function setMode(m){mode=m;document.getElementById('loginTab').className='flex-1 rounded-lg py-2 '+(m==='login'?'bg-indigo-600 font-semibold':'bg-gray-800 text-gray-300 font-semibold');document.getElementById('signupTab').className='flex-1 rounded-lg py-2 '+(m==='signup'?'bg-indigo-600 font-semibold':'bg-gray-800 text-gray-300 font-semibold');btn.textContent=m==='login'?'Login':'Create customer account';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password';msg.textContent='';}
document.getElementById('loginTab').onclick=()=>setMode('login');document.getElementById('signupTab').onclick=()=>setMode('signup');
form.onsubmit=async e=>{e.preventDefault();msg.textContent='Please wait…';btn.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(mode==='signup'){const {data,error}=await client.auth.signUp({email,password});if(error)throw error;if(data.session){msg.textContent='Account created. Opening dashboard…';location.href='./index.html';}else msg.textContent='Registration submitted. Check your email to confirm your account, then log in.';}else{const {error}=await client.auth.signInWithPassword({email,password});if(error)throw error;location.href='./index.html';}}catch(err){msg.textContent=err.message||'Authentication failed.';}finally{btn.disabled=false;}};
if(!window.ROFS_SUPABASE_URL||window.ROFS_SUPABASE_URL.includes('YOUR_PROJECT')){msg.textContent='Setup required: edit supabase-config.js with your Supabase URL and anon/publishable key.';}
</script></body></html>
