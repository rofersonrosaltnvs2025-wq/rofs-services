<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ROFS Services — Admin Login</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./supabase-config.js"></script></head><body class="min-h-screen bg-gray-950 text-gray-100 flex items-center justify-center p-4"><main class="w-full max-w-md bg-gray-900 border border-gray-800 rounded-2xl p-7 shadow-2xl"><div class="flex items-center gap-3 mb-7"><div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-rose-600 to-indigo-500 flex items-center justify-center text-2xl font-extrabold">R</div><div><h1 class="font-extrabold text-xl">ROFS SERVICES</h1><p class="text-sm text-rose-300">Administrator Access</p></div></div><form id="adminForm" class="space-y-4"><label class="block text-sm">Admin email<input id="email" type="email" required autocomplete="username" class="mt-1 w-full rounded-xl bg-gray-950 border border-gray-700 p-3 outline-none focus:border-rose-500"></label><label class="block text-sm">Password<input id="password" type="password" required autocomplete="current-password" class="mt-1 w-full rounded-xl bg-gray-950 border border-gray-700 p-3 outline-none focus:border-rose-500"></label><button id="submitBtn" class="w-full rounded-xl bg-rose-600 hover:bg-rose-500 py-3 font-bold">Sign in as Admin</button></form><p id="message" class="text-sm mt-4 text-gray-300" role="status"></p><p class="text-xs text-gray-500 mt-6">Only accounts whose database role is set to <code>admin</code> can enter. <a class="text-indigo-300 underline" href="./login.html">Customer login</a></p></main><script>
const client=window.supabase.createClient(window.ROFS_SUPABASE_URL,window.ROFS_SUPABASE_ANON_KEY),form=document.getElementById('adminForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');
form.onsubmit=async e=>{e.preventDefault();btn.disabled=true;msg.textContent='Verifying administrator…';try{const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;const {data:profile,error:profileError}=await client.from('profiles').select('role').eq('id',data.user.id).single();if(profileError||profile?.role!=='admin'){await client.auth.signOut();throw new Error('This account is not authorized as an administrator.');}location.href='./index.html';}catch(err){msg.textContent=err.message||'Login failed.';}finally{btn.disabled=false;}};
if(!window.ROFS_SUPABASE_URL||window.ROFS_SUPABASE_URL.includes('YOUR_PROJECT'))msg.textContent='Setup required: edit supabase-config.js with your Supabase URL and anon/publishable key.';
</script></body></html>
